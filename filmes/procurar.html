<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurar Filme - Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <h1 class="mb-4">Consultar Filmes</h1>
    
    <div class="card p-3 mb-4 shadow-sm bg-white">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Buscar por título do filme...">
        <button class="btn btn-primary" type="button">Buscar</button>
      </div>
    </div>

    <div class="table-responsive card shadow-sm">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Título</th>
            <th>Duração (min)</th>
            <th>Nota</th>
            <th>Disponível</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Inception</td>
            <td>148</td>
            <td>8.8</td>
            <td><span class="badge bg-success">Sim</span></td>
          </tr>
          <tr>
            <td>Interstellar</td>
            <td>169</td>
            <td>8.7</td>
            <td><span class="badge bg-success">Sim</span></td>
          </tr>
          <tr>
            <td>Dunkirk</td>
            <td>106</td>
            <td>7.8</td>
            <td><span class="badge bg-danger">Não</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3">
      <a href="../index.html" class="btn btn-secondary">Voltar</a>
    </div>
  </div>
</body>
</html>
