<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Filme - Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <h1 class="mb-4">Alterar Filme</h1>
    <form class="card p-4 shadow-sm bg-white">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" value="Inception" required>
      </div>
      <div class="mb-3">
        <label for="duracao" class="form-label">Duração (minutos)</label>
        <input type="number" class="form-control" id="duracao" value="148" required>
      </div>
      <div class="mb-3">
        <label for="nota" class="form-label">Nota (0.0 a 10.0)</label>
        <input type="number" step="0.1" class="form-control" id="nota" value="8.8" required>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="disponivel" checked>
        <label class="form-check-label" for="disponivel">Disponível no catálogo</label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning">Atualizar Filme</button>
        <a href="../index.html" class="btn btn-secondary">Voltar</a>
      </div>
    </form>
  </div>
</body>
</html>
