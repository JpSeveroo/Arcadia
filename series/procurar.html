<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pesquisar Série - Catálogo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <main class="container my-5">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h1 class="h3 mb-3">Catálogo de Séries</h1>

                    <form action="row g-2">
                        <div class="col-md-9">
                            <label for="busca" class="visually-hidden">
                                Buscar por título
                            </label>

                            <input 
                            type="text"
                            class="form-control"
                            id="busca"
                            name="busca"
                            placeholder="Buscar por título..."
                            >
                        </div>

                        <div class="col-md-3 d-grid">
                            <button type="button" class="btn btn-primary">
                                Pesquisar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
                    <h2 class="h5 mb-0">Lista de Séries</h2>

                    <a href="inserir.html" class="btn btn-sm btn-success">+ Nova Série</a>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <caption class="visually-hidden">
                                Séries e suas informações
                            </caption>

                            <thead class="table-secondary">
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Título</th>
                                    <th scope="col">Temporadas</th>
                                    <th scope="col">Nota</th>
                                    <th scope="col">Finalizada</th>
                                    <th scope="col" class="text-center">Ações</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td class="fw-semibold">Breaking Bad</td>
                                    <td>5</td>
                                    <td>4,8</td>
                                    <td>
                                        <span class="badge bg-success">Sim</span>
                                    </td>
                                    <td class="text-center">
                                        <a href="alterar.html"
                                       class="btn btn-sm btn-warning">
                                        Editar
                                        </a>
                                        <a href="excluir.html"
                                        class="btn btn-sm btn-danger">
                                            Excluir
                                        </a>
                                    </td>
                                </tr>

                                <tr>
                                    <td>2</td>
                                    <td class="fw-semibold">Chernobyl</td>
                                    <td>1</td>
                                    <td>4,8</td>
                                    <td>
                                        <span class="badge bg-success">Sim</span>
                                    </td>
                                    <td class="text-center">
                                        <a href="alterar.html"
                                       class="btn btn-sm btn-warning">
                                        Editar
                                        </a>
                                        <a href="excluir.html"
                                        class="btn btn-sm btn-danger">
                                            Excluir
                                        </a>
                                    </td>
                                </tr>

                                <tr>
                                    <td>3</td>
                                    <td class="fw-semibold">The Bear</td>
                                    <td>3</td>
                                    <td>4,6</td>
                                    <td>
                                        <span class="badge bg-secondary">Não</span>
                                    </td>
                                    <td class="text-center">
                                        <a href="alterar.html"
                                       class="btn btn-sm btn-warning">
                                        Editar
                                        </a>
                                        <a href="excluir.html"
                                        class="btn btn-sm btn-danger">
                                            Excluir
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer text-end">
                    <a href="../index.html" class="btn btn-outline-secondary">Voltar ao Menu Principal</a>
                </div>
            </div>
        </main>
    </body>
</html>
