<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Alterar Série - Catálogo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-light">
        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-warning">
                        <div class="card-header bg-warning text-dark">
                            <h1 class="h4 mb-0">Alterar Dados da Série</h1>
                        </div>

                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="titulo" class="form-label">Título</label>
                                    <input
                                    type="text"
                                    class="form-control"
                                    id="titulo"
                                    name="titulo"
                                    placeholder="Digite o título da série"
                                    value="Breaking Bad"
                                    >
                                </div>

                                <div class="mb-3">
                                    <label for="temporada" class="form-label">Temporadas</label>
                                    <input
                                    type="number"
                                    class="form-control"
                                    id="temporada"
                                    name="temporadas"
                                    placeholder="Digite a quantidade de temporadas"
                                    min="1"
                                    step="1"
                                    value="5"
                                    >
                                </div>
                                
                                <div class="mb-3">
                                    <label for="nota" class="form-label">Nota</label>
                                    <input
                                    type="number"
                                    class="form-control"
                                    id="nota"
                                    name="nota"
                                    placeholder="Digite a nota da série"
                                    min="0"
                                    max="5"
                                    step="0.1"
                                    value="4.8"
                                    >
                                </div>

                                <div class="mb-3 form-check form-switch">
                                    <input
                                    type="checkbox"
                                    class="form-check-input"
                                    role="switch"
                                    id="finalizada"
                                    name="finalizada"
                                    checked
                                    >
                                    <label for="finalizada" class="form-check-label">Finalizada</label>
                                </div>

                                <div class="d-flex justify-content-between mt-4">
                                    <a href="procurar.html" class="btn btn-secondary">Voltar</a>
                                    <button type="button" class="btn btn-warning">Guardar Alterações</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
