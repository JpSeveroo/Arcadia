<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos - Confirmar Exclusão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-sm border-danger">
          <div class="card-header bg-danger text-white">
            <h4 class="mb-0"> Confirmar Exclusão</h4>
          </div>
          
          <div class="card-body">
            <div class="alert alert-warning" role="alert">
                <strong>Atenção:</strong> Tem certeza de que deseja remover este jogo do catálogo? Esta ação não pode ser desfeita.
            </div>

            <form>
              <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" value="Counter-Strike 2" readonly>
              </div>

              <div class="mb-3">
                <label for="ano" class="form-label">Ano de Lançamento</label>
                <input type="number" class="form-control" id="ano" value="2023" readonly>
              </div>

              <div class="mb-3">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input type="text" class="form-control" id="preco" value="0.00 (Grátis)" readonly>
              </div>

              <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="multiplayer" checked disabled>
                <label class="form-check-label" for="multiplayer">Possui modo Multiplayer?</label>
              </div>

              <div class="d-flex justify-content-between mt-4">
                <a href="procurar.html" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sim, Excluir Jogo</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
