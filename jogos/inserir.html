<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Jogo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Cadastrar Novo Jogo</h4>
          </div>
          
          <div class="card-body">
            <form>
              <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" placeholder="Ex: Elden Ring">
              </div>

              <div class="mb-3">
                <label for="ano" class="form-label">Ano de Lançamento</label>
                <input type="number" class="form-control" id="ano" placeholder="Ex: 2022">
              </div>

              <div class="mb-3">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input type="number" step="0.01" class="form-control" id="preco" placeholder="Ex: 249.90">
              </div>

              <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="multiplayer">
                <label class="form-check-label" for="multiplayer">Possui modo Multiplayer?</label>
              </div>

              <div class="d-flex justify-content-between mt-4">
                <a href="../index.html" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-success">Salvar Jogo</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
